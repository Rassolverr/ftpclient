name: Generer Cle APK
on: workflow_dispatch

jobs:
  generer-cle:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generer la cle
        run: |
          keytool -genkeypair -v -keystore ma_cle.jks -alias mon_ftp -keyalg RSA -keysize 2048 -validity 10000 -storepass "12345" -keypass "12345" -dname "CN=ClientFTP, OU=Dev, O=Perso, L=Paris, C=FR"

      - name: Convertir en base64
        run: |
          base64 -w0 ma_cle.jks > ma_cle.b64
          cat ma_cle.b64

      - name: Sauvegarder la cle
        uses: actions/upload-artifact@v4
        with:
          name: ma-cle-secrete
          path: ma_cle.jks
